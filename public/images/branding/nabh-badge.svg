<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <!-- Dark Green Outer Triangle -->
  <polygon points="120,10 230,175 10,175" fill="#143D30" stroke="#0D2820" stroke-width="2"/>
  
  <!-- Slogan along left and right side -->
  <text transform="rotate(-56 120 10)" x="-45" y="80" fill="#FFFFFF" font-size="9" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="1">PATIENT SAFETY &amp;</text>
  <text transform="rotate(56 120 10)" x="145" y="-120" fill="#FFFFFF" font-size="9" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="1">QUALITY OF CARE</text>

  <!-- Inner Triangle Background -->
  <polygon points="120,55 195,160 45,160" fill="#FFFFFF"/>

  <!-- NABH Emblem Graphics -->
  <circle cx="120" cy="105" r="24" fill="none" stroke="#0284C7" stroke-width="5"/>
  <rect x="112" y="90" width="16" height="24" fill="#DC2626"/>
  <rect x="110" y="85" width="20" height="5" fill="#0284C7"/>
  <rect x="108" y="114" width="24" height="4" fill="#0284C7"/>

  <!-- Bottom NABH Text & Pre-Accredited -->
  <rect x="100" y="125" width="40" height="14" fill="#FFFFFF"/>
  <text x="120" y="136" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369A1">NABH</text>

  <!-- Pre Accredited Banner -->
  <rect x="55" y="160" width="130" height="20" fill="#143D30"/>
  <text x="120" y="174" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF" letter-spacing="1.5">PRE ACCREDITED</text>
</svg>
