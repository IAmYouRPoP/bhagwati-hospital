<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="facade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bldBg)"/>
  <!-- Hospital Building Base -->
  <rect x="150" y="80" width="500" height="420" fill="url(#facade)" rx="6" stroke="#CBD5E1" stroke-width="4"/>
  <!-- Main Entrance -->
  <rect x="330" y="340" width="140" height="160" fill="#0A2540" rx="4"/>
  <rect x="345" y="360" width="110" height="140" fill="#38BDF8" opacity="0.5"/>
  <!-- Red Cross on Building Top -->
  <rect x="385" y="110" width="30" height="70" fill="#DC2626"/>
  <rect x="365" y="130" width="70" height="30" fill="#DC2626"/>
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#0A2540" text-anchor="middle" letter-spacing="2">BHAGWATI HOSPITAL</text>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle" letter-spacing="1">NABH PRE-ACCREDITED • ESTD 1994</text>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#DC2626" text-anchor="middle">Safe Surgery Saves Life</text>
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">325, Chaw Mandi, Roorkee</text>
</svg>
