<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background with dark border -->
  <rect x="5" y="5" width="190" height="190" rx="8" fill="#FFFFFF" stroke="#1B4D3E" stroke-width="6"/>
  
  <!-- Red Cross -->
  <!-- Vertical bar -->
  <rect x="75" y="20" width="50" height="160" fill="#DC2626" rx="3"/>
  <!-- Horizontal bar -->
  <rect x="20" y="75" width="160" height="50" fill="#DC2626" rx="3"/>
  
  <!-- Corner Triangles / Directional arrows (Green) -->
  <!-- Top Left Arrow -->
  <polygon points="20,20 65,20 20,65" fill="#1B4D3E"/>
  <polygon points="35,35 60,35 35,60" fill="#FFFFFF"/>
  <polygon points="40,40 55,40 40,55" fill="#1B4D3E"/>

  <!-- Top Right Arrow -->
  <polygon points="180,20 135,20 180,65" fill="#1B4D3E"/>
  <polygon points="165,35 140,35 165,60" fill="#FFFFFF"/>
  <polygon points="160,40 145,40 160,55" fill="#1B4D3E"/>

  <!-- Bottom Left Arrow -->
  <polygon points="20,180 65,180 20,135" fill="#1B4D3E"/>
  <polygon points="35,165 60,165 35,140" fill="#FFFFFF"/>
  <polygon points="40,160 55,160 40,145" fill="#1B4D3E"/>

  <!-- Bottom Right Arrow -->
  <polygon points="180,180 135,180 180,135" fill="#1B4D3E"/>
  <polygon points="165,165 140,165 165,140" fill="#FFFFFF"/>
  <polygon points="160,160 145,160 160,145" fill="#1B4D3E"/>

  <!-- Center Circle for 'BH' -->
  <ellipse cx="100" cy="100" rx="32" ry="24" fill="#FFFFFF" stroke="#1B4D3E" stroke-width="4"/>
  <text x="100" y="108" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="24" text-anchor="middle" fill="#0A192F" letter-spacing="1">BH</text>
</svg>
